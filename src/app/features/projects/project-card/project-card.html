<div class="card">
  <div class="card-header">
    @if (project.icon) {
      <img class="card-icon" [src]="project.icon" [alt]="project.title" />
    }
    <h3 class="card-title">{{ project.title }}</h3>
  </div>
  @if (project.media) {
    <div class="card-media-wrap"
         [style.aspect-ratio]="project.mediaWidth && project.mediaHeight ? project.mediaWidth + ' / ' + project.mediaHeight : null">
      <img class="card-media" [src]="project.media" [alt]="project.title" loading="lazy"
           (load)="onMediaSettled()" (error)="onMediaSettled()" />
      @if (!mediaLoaded()) {
        <div class="card-media-placeholder"></div>
      }
    </div>
  }
  <p class="card-description">{{ project.description }}</p>
  <div class="card-tags">
    @for (tag of project.tags; track tag) {
      <span class="tag" [attr.data-tag]="tag">{{ tag }}</span>
    }
    @if (project.url) {
      <a class="card-repo" [href]="project.url" [title]="project.url"
         target="_blank" rel="noopener noreferrer">GitHub</a>
    } @else {
      <span class="card-closed" title="Source not publicly available">Closed Source</span>
    }
  </div>
</div>
